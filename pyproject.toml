[project]
name = "pydantic-lab"
version = "0.1.0"
description = "A readable coding agent lab with durable controls and isolated workspaces"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openai,mcp]==2.61.0",
  "pydantic-ai-harness[skills]==0.61.0",
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "pymysql[rsa]",
  "redis",
  "prompt-toolkit",
  "rich",
  "httpx",
  "python-dotenv",
  "fastmcp-slim[server]==4.1.3",
]

[project.scripts]
pydantic-lab = "pydantic_lab.cli.main:main"
lab-api = "pydantic_lab.api.server:main"
lab-agent = "pydantic_lab.application.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "playwright>=1.56,<2",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires Docker or database services", "live: sends paid model requests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
